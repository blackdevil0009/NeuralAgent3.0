server {
    listen 80;
    server_name vaidyamedx.in www.vaidyamedx.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vaidyamedx.in www.vaidyamedx.in;

    ssl_certificate     /etc/letsencrypt/live/vaidyamedx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaidyamedx.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Backend API + WebSocket proxy ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Socket.IO / WebSocket ───────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── Uploaded files ──────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── React frontend (catch-all) ──────────────────────────────
    location / {
        root  /opt/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
